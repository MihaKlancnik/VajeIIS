      preprocessed air data on `date` with DVC pipeline and GitHub workflows\" ||
      true\ngit push || True\ndvc push || True\n"
    deps:
    - path: data/raw/air/air_data.xml
      hash: md5
      md5: 3a5144063e22785477d2fe167f3e3005
      size: 1150504
    - path: src/data/preprocess_air_data.py
      hash: md5
      md5: 5f63e44f23539127a621e7509c29eced
      size: 2482
    params:
      params.yaml:
        preprocess.station: {}
    outs:
    - path: data/preprocessed/air
      hash: md5
      md5: 2a25b14adb17993ed44a9c6b3912580e.dir
      size: 426544
      nfiles: 23
