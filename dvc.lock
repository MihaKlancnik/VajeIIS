    - path: data/raw/air/air_data.xml
      hash: md5
      md5: 5ee0a54c2d75f6bd6ba7c8f3bc409f71
      size: 1151199
    - path: src/data/preprocess_air_data.py
      hash: md5
      md5: a2c4e6c4d6ec3d7c9275d0a69ae652d6
      size: 2550
    params:
      params.yaml:
        preprocess.station: {}
    outs:
    - path: data/preprocessed/air
