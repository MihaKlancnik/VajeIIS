    - path: data/raw/air/air_data.xml
      hash: md5
      md5: addf1feae08f5d41f896f129f8b099b9
      size: 1150962
    - path: src/data/preprocess_air_data.py
      hash: md5
      md5: 5f63e44f23539127a621e7509c29eced
      size: 2482
    params:
      params.yaml:
        preprocess.station: {}
    outs:
    - path: data/preprocessed/air
      hash: md5
      md5: eca88fa1fbd969e5a5ab2dc6a622c758.dir
      size: 216642
      nfiles: 23
