      hash: md5
      md5: 2ee8093f1034b95aa8a02fb9e9197dca.dir
      size: 510892
      nfiles: 23
    - path: src/data/test_data.py
      hash: md5
      md5: 3eb77141b409b9248c7d2c5adc55e934
